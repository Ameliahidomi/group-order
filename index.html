<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>年貨團購系統</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body {
    font-family: "Noto Sans TC", sans-serif;
    background: url('background.jpg') no-repeat center center/cover;
    background-attachment: fixed;
    color: #fff;
    text-align: center;
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
  }
  .overlay {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.4);
    z-index: -1;
  }
  .container { padding: 25px 35px; width: 92%; max-width: 500px; margin: 40px auto; box-sizing: border-box; }
  
  h1, h2 {
    color: #b50000;
    font-weight: 900;
    text-shadow: 2px 2px 4px #fff, -2px -2px 4px #fff, 0 0 8px rgba(255,255,255,0.5);
    /* 已移除 nowrap，讓長標題在手機上能自動漂亮換行 */
    line-height: 1.3;
  }
  
  p { color: #660000; font-weight: 600; }
  
  button {
    background: linear-gradient(45deg,#d12,#f93);
    color: #fff; border: none; border-radius: 8px;
    padding: 12px 20px; cursor: pointer;
    transition: all 0.3s ease; display: inline-block;
  }
  button:hover { transform: scale(1.05); }
  
  select, input {
    width: 100%; padding: 10px;
    border: 1px solid #ccc; border-radius: 8px; font-size: 16px;
    box-sizing: border-box;
  }
  .hidden { display:none; }

/* 💻 電腦版螢幕 */
  @media (min-width:1025px){ 
    h1 { font-size: 2rem; } 
    p { font-size: 1.2rem; } 
    button { font-size: 1rem; padding: 12px 24px; margin: 10px; } 
  }
  
  /* 📱 平板螢幕 */
  @media (min-width:601px) and (max-width:1024px){ 
    h1 { font-size: 1.7rem; } 
    p { font-size: 1.05rem; } 
    button { font-size: 0.95rem; padding: 11px 22px; margin: 8px; } 
  }
  
  /* 📱 手機螢幕（將字體微調至最適合手機寬度的尺寸） */
  @media (max-width:600px){ 
    .container { margin: 20px auto; padding: 20px 15px; width: 92%; }
    h1 { font-size: 1.35rem; line-height: 1.4; margin-bottom: 12px; } /* 縮小手機版標題字體，避免過寬 */
    h2 { font-size: 1.2rem; }
    p { font-size: 0.9rem; line-height: 1.5; } 
    button { font-size: 0.9rem; padding: 12px 20px; margin: 8px 0; width: 85%; }
  }

  #homePage img { animation: floatLogo 3s ease-in-out infinite; }
  @keyframes floatLogo{0%{transform:translateY(0);}50%{transform:translateY(-8px);}100%{transform:translateY(0);}}

  .redpacket {
    position: fixed; top: -50px;
    width: 35px; height: 40px;
    background-image: url('redpacket.png'); background-size: cover;
    animation: fall linear forwards; pointer-events:none;
  }
  @keyframes fall { to{transform:translateY(110vh) rotate(360deg);opacity:0.8;} }

  #cartIcon {
    position: fixed; top: 15px; right: 20px;
    font-size: 1.8rem; cursor: pointer; z-index: 30;
  }
  #cartCount {
    position: absolute; top: 5px; right: 5px;
    background: #fff; color: #b50000;
    border-radius: 50%; width: 18px; height: 18px;
    font-size: 12px; line-height: 18px; text-align: center;
  }
  #cartPanel {
    position: fixed; top: 0; right: -320px;
    width: 300px; height: 100%;
    background: rgba(255,255,255,0.95); color:#000;
    box-shadow:-2px 0 10px rgba(0,0,0,0.4);
    transition:right 0.4s ease; padding:20px; overflow-y:auto; z-index:1000;
  }
  #cartPanel.active{ right:0; }
  #cartOverlay {
    display:none; position:fixed; top:0; left:0;
    width:100%; height:100%; background:rgba(0,0,0,0.3); z-index:999;
  }
  #cartOverlay.active{ display:block; }
  #popupMsg {
    position:fixed; top:40%; left:50%; transform:translate(-50%,-50%);
    background:#fff; color:#b50000; border-radius:15px; padding:20px 30px;
    font-size:1.1rem; font-weight:bold; box-shadow:0 4px 15px rgba(0,0,0,0.3);
    display:none; z-index:2000; width: 80%; max-width: 300px;
  }

  #orderPage { position:relative; border-radius:15px; padding:25px 20px; color:#222;
    background:rgba(255,248,231,0.95); overflow:hidden; }
  #orderPage::before {
    content:""; position:absolute; top:0; left:0; width:100%; height:100%;
    background:url('order-bg.png') center/cover no-repeat; opacity:0.4;
    z-index:-1; border-radius:15px;
  }
  #orderForm.form-grid {
    display:grid; grid-template-columns:120px 1fr; gap:12px 12px;
    align-items:center; margin-top:10px;
  }
  #orderForm label { text-align:right; font-weight:bold; color:#fff;
    background:#b50000; padding:6px 8px; border-radius:6px; text-shadow:1px 1px 2px #000; font-size: 0.9rem; }
  
  @media(max-width:600px){
    #orderForm.form-grid{grid-template-columns:1fr; gap:8px;}
    #orderForm label{text-align:left;}
  }

  #queryPage .query-row{
    display:flex; align-items:center; justify-content:flex-start;
    gap:10px; margin-bottom:10px; flex-wrap: wrap;
  }
  #queryPage label{
    width:100%; font-weight:bold; color:#b50000; text-align:left;
  }
  #queryPage input{ flex:1; min-width:150px; }
  #orderList table{
    width:100%; border-collapse:collapse; table-layout:auto;
    background:#fff9e6; word-break:break-word; font-size: 0.9rem;
  }
  #orderList th,#orderList td{
    text-align:center; padding:8px 4px; color:#333;
  }
  #orderList th{ background:#ffe2b3; color:#b50000; }
</style>
</head>
<body>
<div class="overlay"></div>

<!-- 背景音樂標籤 (preload="none" 確保不佔頻寬影響速度) -->
<audio id="bgMusic" loop preload="none">
  <source src="bgm.mp3" type="audio/mpeg">
</audio>

<div id="cartIcon" onclick="toggleCart()">🛒<div id="cartCount">0</div></div>
<div id="cartOverlay" onclick="toggleCart()"></div>
<div id="cartPanel">
  <h3>購物車清單</h3>
  <div id="cartList"></div>
  <button onclick="submitCart()">送出訂單</button>
</div>

<div class="container" id="homePage">
  <img src="logo.png" width="80" />
  <h1>年貨團購「羊」威登場，<br>買到賺到！</h1>
  <p>一起揪團買年貨，荷包不瘦、過年得意「羊羊」！！</p>
  <button onclick="showPage('orderPage')">🛍️ 開始訂購</button>
  <button onclick="showPage('queryPage')">🔎 查看我的訂單</button>
</div>

<div class="container hidden" id="orderPage">
  <h2>🛒 填寫訂單</h2>
  <form id="orderForm" class="form-grid">
    <label>訂購人姓名：</label><input type="text" id="buyerName">
    <label>商家：</label><select id="merchant"></select>
    <label>商品：</label><select id="product"></select>
    <label>數量：</label><input type="number" id="qty" value="1" min="1">
  </form>
  <button onclick="addToCart()">加入購物車</button>
  <button onclick="showPage('homePage')">🏠 返回首頁</button>
</div>

<div class="container hidden" id="queryPage">
  <h2>🔍 查詢我的訂單</h2>
  <div class="query-row">
    <label>輸入訂購人姓名：</label>
    <input type="text" id="queryName" placeholder="請輸入您的姓名">
    <button onclick="searchOrders()">查詢</button>
  </div>
  <button onclick="showPage('homePage')">🏠 返回首頁</button>
  <div id="orderList"></div>
</div>

<div id="popupMsg"></div>

<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbxOWJ24BakrQU8NG0j1MgZRmhao7zoXGVmdlf_rowLYSh0yTztK2qyLNk4Vq_JO4QfI/exec";
let allProducts=[],cart=[],redPacketTimer;

function showPopup(t,d=1800){
  const p=document.getElementById('popupMsg');
  p.textContent=t;p.style.display='block';
  setTimeout(()=>{p.style.display='none';},d);
}
function startRedPackets(){stopRedPackets();redPacketTimer=setInterval(()=>{for(let i=0;i<3;i++){const rp=document.createElement('div');rp.className='redpacket';rp.style.left=Math.random()*100+'vw';rp.style.animationDuration=5+Math.random()*3+'s';document.body.appendChild(rp);setTimeout(()=>rp.remove(),9000);}},1500);}
function stopRedPackets(){clearInterval(redPacketTimer);document.querySelectorAll('.redpacket').forEach(e=>e.remove());}
function showPage(id){document.querySelectorAll('.container').forEach(e=>e.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='homePage'){startRedPackets();}else{stopRedPackets();}}
function preloadData(){const m=document.getElementById('merchant');m.innerHTML='<option>讀取中...</option>';fetch(`${WEB_APP_URL}?action=getProducts`).then(r=>r.json()).then(d=>{allProducts=d;fillMerchants();}).catch(()=>{m.innerHTML='<option>載入失敗</option>';showPopup('⚠️ 無法載入商品資料');});}

// 商家網址對照表
const vendorLinks = {
  "華記蜜餞": "https://www.hua-tainan.com.tw",
  "鄭美香食品行": "https://www.nutsking.com.tw",
  "蒙恩聽障烘焙":"https://www.deaf.com.tw/productslist/products/291?category=3&type=5"
};

function fillMerchants() {
  const merchants = [...new Set(allProducts.map(p => p.vendor))];
  const m = document.getElementById('merchant');

  m.innerHTML =
    '<option value="">請選擇商家</option>' +
    merchants.map(v => `<option>${v}</option>`).join('');

  m.onchange = () => {
    const vendor = m.value;
    fillProducts(vendor);
    document.getElementById('qty').value = 1;

    const url = vendorLinks[vendor];
    if (url) {
      setTimeout(() => {
        window.open(url, "_blank");
      }, 200);
    }
  };
}

function fillProducts(vendor){const ps=allProducts.filter(p=>p.vendor===vendor);const p=document.getElementById('product');p.innerHTML='<option value="">請選擇商品</option>'+ps.map(x=>`<option value="${x.item}" data-price="${x.price}">${x.item} - $${x.price}</option>`).join('');p.onchange=()=>{document.getElementById('qty').value=1;};}
function addToCart(){const buyer=document.getElementById('buyerName').value.trim();const vendor=document.getElementById('merchant').value;const prodSel=document.getElementById('product');const item=prodSel.value;const price=Number(prodSel.selectedOptions[0]?.dataset.price||0);const qty=Number(document.getElementById('qty').value);if(!buyer||!vendor||!item){showPopup('⚠️ 請完整填寫');return;}cart.push({buyer,vendor,item,price,qty});document.getElementById('cartCount').textContent=cart.length;showPopup('✅ 已加入購物車！');}
function toggleCart(){const p=document.getElementById('cartPanel');const o=document.getElementById('cartOverlay');const a=p.classList.toggle('active');o.classList.toggle('active',a);if(a)renderCart();}
function renderCart(){const d=document.getElementById('cartList');if(!cart.length){d.innerHTML='<p>購物車是空的。</p>';return;}let html='<table><tr><th>商品</th><th>數量</th><th>小計</th><th></th></tr>';cart.forEach((c,i)=>{html+=`<tr><td>${c.item}</td><td>${c.qty}</td><td>$${c.price*c.qty}</td><td><button style="font-size:12px;padding:3px 6px;border-radius:4px;" onclick="delItem(${i})">❌</button></td></tr>`;});const total=cart.reduce((a,b)=>a+b.price*b.qty,0);html+=`</table><p><b>總計：$${total}</b></p>`;d.innerHTML=html;}
function delItem(i){cart.splice(i,1);document.getElementById('cartCount').textContent=cart.length;renderCart();}

async function submitCart(){
  if(!cart.length){showPopup('購物車是空的');return;}
  if(!window.confirm('確定要送出這些訂單嗎？'))return;
  try{
    const f=new FormData();
    f.append('action','addBatchOrders');
    f.append('orders',JSON.stringify(cart));
    await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:f});
    showPopup('✅ 訂單已送出！請稍後查詢確認');
    cart=[];document.getElementById('cartCount').textContent=0;toggleCart();
    document.getElementById('buyerName').value='';
    document.getElementById('merchant').selectedIndex=0;
    document.getElementById('product').innerHTML='<option value="">請選擇商品</option>';
    document.getElementById('qty').value=1;
  }catch(err){console.error(err);showPopup('⚠️ 系統錯誤，請稍後再試');}
}

function searchOrders(){
  const name=document.getElementById('queryName').value.trim();
  if(!name){showPopup('請輸入姓名');return;}
  fetch(`${WEB_APP_URL}?action=getOrders&name=${encodeURIComponent(name)}`)
  .then(r=>r.json())
  .then(d=>{
    const l=document.getElementById('orderList');
    if(!d.length){l.innerHTML='<p>查無訂單。</p>';return;}
    let total=0;
    let html='<table><tr><th>商家</th><th>商品名稱</th><th>數量</th><th>金額</th></tr>';
    d.forEach(o=>{
      const subtotal=Number(o.price)*Number(o.qty||1);
      total+=subtotal;
      html+=`<tr><td>${o.vendor}</td><td>${o.item}</td><td>${o.qty}</td><td>$${subtotal}</td></tr>`;
    });
    html+=`<tr style="font-weight:bold;background:#ffe2b3;color:#b50000;"><td colspan="3">合計</td><td>$${total}</td></tr></table>`;
    l.innerHTML=html;
  })
  .catch(err=>{console.error(err);showPopup('⚠️ 查詢失敗，請稍後再試');});
}

// 🎵 自動解鎖音樂播放（使用者一進入網站點擊任何地方，音樂立即開始）
const bgMusic = document.getElementById('bgMusic');
function unlockAudio() {
  bgMusic.play().then(() => {
    // 成功播放後，移除監聽事件，避免重複觸發
    document.removeEventListener('click', unlockAudio);
    document.removeEventListener('touchstart', unlockAudio);
  }).catch(err => {
    console.log('等待使用者互動播放音樂');
  });
}
document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio);

window.addEventListener('DOMContentLoaded',()=>{startRedPackets();preloadData();});
</script>
</body></html>
